<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mookse Zeilweek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // Beveiligingscheck: Is de beheerder ingelogd?
        if (localStorage.getItem('admin_ingelogd') !== 'true') {
            window.location.href = 'login.html'; // Stuur terug als niet ingelogd
        }

        function logUit() {
            localStorage.removeItem('admin_ingelogd');
            window.location.href = 'index.html';
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <nav class="bg-slate-900 text-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-lock text-yellow-400"></i>
                <span class="text-xl font-bold">Beheerderspaneel</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-slate-300 hover:text-white text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Terug naar website</a>
                <button onclick="logUit()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm font-bold transition">Uitloggen</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Recente Aanmeldingen</h2>
            <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm font-bold"><i class="fa-solid fa-download mr-2"></i>Exporteer CSV</button>
        </div>

        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-max">
                <thead>
                    <tr class="bg-slate-50 border-b">
                        <th class="p-4 font-semibold text-sm text-slate-600">ID</th>
                        <th class="p-4 font-semibold text-sm text-slate-600">Naam</th>
                        <th class="p-4 font-semibold text-sm text-slate-600">Leeftijd</th>
                        <th class="p-4 font-semibold text-sm text-slate-600">Programma</th>
                        <th class="p-4 font-semibold text-sm text-slate-600">Detail (Niveau/Tijd)</th>
                        <th class="p-4 font-semibold text-sm text-slate-600">Kosten</th>
                        <th class="p-4 font-semibold text-sm text-slate-600">Status</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        function laadAanmeldingen() {
            const tabel = document.getElementById('adminTableBody');
            
            // Haal data op uit de browser (of een lege lijst als er niets is)
            const data = JSON.parse(localStorage.getItem('zeilweek_aanmeldingen')) || [];
            
            if(data.length === 0) {
                tabel.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500 italic">Nog geen nieuwe aanmeldingen gevonden via het formulier.</td></tr>';
                return;
            }

            // Render de data naar HTML (nieuwste bovenaan door .reverse())
            tabel.innerHTML = data.reverse().map(item => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-4 text-sm text-slate-500">${item.id}</td>
                    <td class="p-4 font-medium">${item.voornaam} ${item.achternaam}</td>
                    <td class="p-4 text-sm">${item.leeftijd}</td>
                    <td class="p-4 text-sm">
                        <span class="${item.programma === 'Junior' ? 'text-teal-600' : 'text-blue-600'} font-bold">${item.programma}</span>
                    </td>
                    <td class="p-4 text-sm text-slate-500">${item.details}</td>
                    <td class="p-4 text-sm">€${item.programma === 'Junior' ? '75' : '135'},-</td>
                    <td class="p-4"><span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded font-bold">${item.status}</span></td>
                </tr>
            `).join('');
        }

        // Roep de functie direct aan zodra de pagina inlaadt
        document.addEventListener('DOMContentLoaded', laadAanmeldingen);
    </script>
</body>
</html>
